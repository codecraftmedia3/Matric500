<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIC500 · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#F3F4EE', surface:'#FFFFFF', surface2:'#E9EFE1', line:'#DDE2D8', ink:'#0F2A23', muted:'#3F544B', cyan:'#1F6B4F', magenta:'#C23B22', purple:'#0F2A23', volt:'#C8F25A', coral:'#FF6F4D' },
    fontFamily: { display:['"Bricolage Grotesque"','Figtree','sans-serif'], sans:['Figtree','system-ui','sans-serif'], mono:['"IBM Plex Mono"','monospace'] }
  } } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">

<header class="flex items-center justify-between border-b border-line bg-bg/90 px-4 py-3 backdrop-blur sm:px-8">
  <h1 class="flex items-center gap-2.5 font-display text-xl font-extrabold tracking-tight text-ink"><span class="grid h-9 w-9 place-items-center rounded-xl bg-ink" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F25A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v13a3 3 0 0 0 3 3h9"/><path d="M12 4v8"/></svg></span>Matric500 <span class="rounded-full bg-volt px-3 py-1 font-sans text-xs font-bold text-ink">Admin</span></h1>
  <div class="flex items-center gap-3 font-mono text-xs text-muted"><span id="live" class="flex items-center gap-1.5"><i class="h-2 w-2 animate-pulse rounded-full bg-cyan"></i>LIVE · 10s</span><a href="/" class="rounded-full border-2 border-ink px-4 py-1.5 font-sans text-sm font-bold text-ink hover:bg-ink hover:text-white">← App</a></div>
</header>

<main class="mx-auto max-w-6xl space-y-5 px-4 py-6 sm:px-6">
  <section class="grid grid-cols-2 gap-3 lg:grid-cols-4" id="metrics" aria-label="System stats"></section>

  <section class="grid gap-4 lg:grid-cols-3">
    <div class="rounded-xl border border-line bg-surface p-4 lg:col-span-2"><h2 class="mb-2 font-mono text-[11px] uppercase tracking-widest text-muted">Sign-ups · last 14 days</h2><div class="h-52"><canvas id="signupChart"></canvas></div></div>
    <div class="rounded-xl border border-line bg-surface p-4"><h2 class="mb-2 font-mono text-[11px] uppercase tracking-widest text-muted">Accounts</h2><div class="h-52"><canvas id="tierChart"></canvas></div></div>
  </section>

  <section class="rounded-xl border border-line bg-surface p-4">
    <div class="mb-3 flex flex-wrap items-center gap-2">
      <h2 class="mr-auto font-display text-sm font-bold text-ink">Users</h2>
      <input id="q" placeholder="Search name or email" class="w-full rounded-lg border border-line bg-bg px-3 py-2 text-sm focus:border-cyan focus:outline-none sm:w-60">
      <select id="fStatus" class="rounded-lg border border-line bg-bg px-2 py-2 text-sm"><option value="">All status</option><option value="active">Active</option><option value="banned">Banned</option></select>
    </div>
    <div class="overflow-x-auto"><table class="w-full min-w-[1020px] text-left text-sm">
      <thead class="font-mono text-[11px] uppercase tracking-widest text-muted"><tr><th class="py-2">User</th><th>Status</th><th>Grade</th><th>School</th><th>Field</th><th>Joined</th><th class="w-40">Progress</th><th class="text-right">Actions</th></tr></thead>
      <tbody id="rows" class="divide-y divide-line"></tbody>
    </table></div>
    <div class="mt-3 flex items-center justify-between font-mono text-xs text-muted"><span id="pageInfo"></span><div class="flex gap-2"><button id="prev" class="rounded border border-line px-3 py-1.5 hover:border-cyan disabled:opacity-30">Prev</button><button id="next" class="rounded border border-line px-3 py-1.5 hover:border-cyan disabled:opacity-30">Next</button></div></div>
  </section>

  <section class="rounded-xl border border-line bg-surface p-4">
    <h2 id="progTitle" class="mb-2 font-mono text-[11px] uppercase tracking-widest text-muted">Milestone progress · select a user (click a row)</h2>
    <div class="h-72"><canvas id="progChart"></canvas></div>
  </section>
</main>

<!-- Defensive confirmation dialog -->
<div id="dlg" class="fixed inset-0 z-50 hidden items-center justify-center bg-bg/85 p-4" role="alertdialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="w-full max-w-md rounded-2xl border-2 border-magenta bg-surface p-6">
    <h3 id="dTitle" class="font-display text-lg font-bold text-magenta"></h3>
    <p id="dText" class="mt-2 text-sm text-muted"></p>
    <div id="dGuard" class="mt-3 hidden"><label class="font-mono text-[11px] text-muted">Type <b id="dExpect" class="text-ink"></b> to confirm</label><input id="dInput" autocomplete="off" class="mt-1 w-full rounded-lg border border-line bg-bg px-3 py-2 text-sm focus:border-magenta focus:outline-none"></div>
    <p id="dErr" class="mt-2 h-4 text-xs text-magenta"></p>
    <div class="mt-3 flex justify-end gap-2"><button id="dNo" class="rounded-lg border border-line px-4 py-2 text-xs font-bold text-muted hover:text-ink">Cancel</button><button id="dYes" class="rounded-lg bg-magenta px-4 py-2 text-xs font-bold text-bg disabled:opacity-40">Confirm</button></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const state = { page: 1, q: '', status: '', tier: '', sel: null, users: [] };

async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' } });
  if (r.status === 401 || r.status === 403) { location.href = '/'; throw new Error('forbidden'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

/* ---------- charts ---------- */
Chart.defaults.color = '#3F544B'; Chart.defaults.font.family = 'Figtree';
const grid = { color: 'rgba(15,42,35,.08)' };
const signupChart = new Chart($('signupChart'), { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#1F6B4F', backgroundColor: 'rgba(200,242,90,.35)', fill: true, tension: .3 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid }, y: { grid, beginAtZero: true, ticks: { precision: 0 } } } } });
const tierChart = new Chart($('tierChart'), { type: 'doughnut', data: { labels: ['Active', 'Banned'], datasets: [{ data: [0, 0], backgroundColor: ['#0F2A23', '#FF6F4D'], borderColor: '#fff' }] }, options: { maintainAspectRatio: false, cutout: '65%' } });
const progChart = new Chart($('progChart'), { type: 'bar', data: { labels: [], datasets: [
  { label: 'Done', data: [], backgroundColor: '#1F6B4F' }, { label: 'Challenging', data: [], backgroundColor: '#FF6F4D' }, { label: 'Remaining', data: [], backgroundColor: '#DDE2D8' }] },
  options: { maintainAspectRatio: false, indexAxis: 'y', scales: { x: { stacked: true, grid }, y: { stacked: true, grid: { display: false } } } } });

/* ---------- data ---------- */
async function loadStats() {
  const s = await api('/stats');
  const cards = [['Total users', s.total, 'text-cyan'], ['Active', s.active, 'text-ink'], ['Banned', s.banned, 'text-magenta'], ['Avg completion', s.avgCompletionPct + '%', 'text-purple']];
  $('metrics').innerHTML = cards.map(([l, v, c]) => `<div class="rounded-xl border border-line bg-surface p-4"><p class="font-mono text-[11px] uppercase tracking-widest text-muted">${l}</p><p class="mt-1 font-display text-3xl font-extrabold ${c}">${esc(v)}</p></div>`).join('');
  signupChart.data.labels = s.signups.map((x) => x.day); signupChart.data.datasets[0].data = s.signups.map((x) => x.n); signupChart.update();
  tierChart.data.datasets[0].data = [s.active, s.banned]; tierChart.update();
}
async function loadUsers() {
  const p = new URLSearchParams({ page: state.page, q: state.q, status: state.status, tier: state.tier });
  const d = await api('/users?' + p);
  state.users = d.users;
  $('rows').innerHTML = d.users.map((u) => `
    <tr data-id="${u.user_id}" class="cursor-pointer hover:bg-surface2 ${state.sel === u.user_id ? 'bg-surface2' : ''}">
      <td class="py-2.5"><div class="font-bold">${esc(u.name)}${u.role === 'admin' ? ' <span class="rounded bg-ink px-1.5 text-[10px] text-volt">ADMIN</span>' : ''}</div><div class="font-mono text-xs text-muted">${esc(u.email)}</div></td>
      <td><span class="font-mono text-xs ${u.account_status === 'banned' ? 'text-magenta' : 'text-cyan'}">${esc(u.account_status)}</span></td>
      <td>${u.grade == null ? '-' : esc(u.grade)}</td>
      <td>${u.school ? esc(u.school) : '-'}</td>
      <td>${u.stream === 'natural' ? 'Natural Science' : u.stream === 'social' ? 'Social Science' : '-'}</td>
      <td class="font-mono text-xs text-muted">${new Date(u.registration_date).toLocaleDateString()}</td>
      <td><div class="h-2 overflow-hidden rounded-full bg-bg"><div class="h-2 rounded-full bg-cyan" style="width:${u.completionPct}%"></div></div><span class="font-mono text-[11px] text-muted">${u.done_count}/${d.totalNodes} · ${u.completionPct}%</span></td>
      <td class="whitespace-nowrap text-right">
        ${u.role === 'admin' ? '' : `<button data-act="ban" class="rounded border px-2 py-1 text-xs font-bold ${u.account_status === 'banned' ? 'border-cyan text-cyan' : 'border-magenta text-magenta'}">${u.account_status === 'banned' ? 'Unban' : 'Ban'}</button>`}
        <button data-act="reset" class="ml-1 rounded border border-ink px-2 py-1 text-xs font-bold text-ink">Reset tokens</button></td>
    </tr>`).join('') || '<tr><td colspan="8" class="py-6 text-center text-muted">No users match.</td></tr>';
  $('pageInfo').textContent = `Page ${d.page} / ${d.pages} · ${d.total} users`;
  $('prev').disabled = d.page <= 1; $('next').disabled = d.page >= d.pages;
}
async function loadProgress() {
  if (!state.sel) return;
  const d = await api(`/users/${state.sel}/progress`);
  $('progTitle').textContent = `Milestone progress · ${d.name}`;
  progChart.data.labels = d.groups.map((g) => g.label);
  progChart.data.datasets[0].data = d.groups.map((g) => g.done);
  progChart.data.datasets[1].data = d.groups.map((g) => g.challenging);
  progChart.data.datasets[2].data = d.groups.map((g) => g.total - g.done - g.challenging);
  progChart.update();
}

/* ---------- defensive confirmation ---------- */
function confirmAction({ title, text, expect }) {
  return new Promise((resolve) => {
    $('dTitle').textContent = title; $('dText').textContent = text; $('dErr').textContent = ''; $('dInput').value = '';
    $('dGuard').classList.toggle('hidden', !expect); $('dExpect').textContent = expect || '';
    const yes = $('dYes'); yes.disabled = !!expect;
    const finish = (v) => { $('dlg').classList.add('hidden'); $('dlg').classList.remove('flex'); yes.onclick = $('dNo').onclick = $('dInput').oninput = null; resolve(v); };
    $('dInput').oninput = () => { yes.disabled = $('dInput').value.trim().toLowerCase() !== expect.toLowerCase(); };
    yes.onclick = () => finish(true); $('dNo').onclick = () => finish(false);
    $('dlg').classList.remove('hidden'); $('dlg').classList.add('flex');
  });
}
async function act(kind, u) {
  try {
    if (kind === 'ban') {
      const banning = u.account_status !== 'banned';
      if (!(await confirmAction(banning
        ? { title: 'Ban this user?', text: `${u.name} will be signed out immediately and blocked from the app.`, expect: u.email }
        : { title: 'Restore this account?', text: `${u.name} will be able to sign in again.` }))) return;
      await api(`/users/${u.user_id}/ban`, { method: 'POST', body: JSON.stringify({ banned: banning, reason: banning ? 'Banned by admin' : null }) });
    } else {
      if (!(await confirmAction({ title: 'Reset access tokens?', text: `Every active session for ${u.name} is invalidated. They must sign in again.` }))) return;
      await api(`/users/${u.user_id}/reset-tokens`, { method: 'POST', body: '{}' });
    }
    await Promise.all([loadUsers(), loadStats()]);
  } catch (e) { alert(e.message); }
}

/* ---------- events ---------- */
$('rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const u = state.users.find((x) => x.user_id === tr.dataset.id), btn = e.target.closest('[data-act]');
  if (btn) return act(btn.dataset.act, u);
  state.sel = u.user_id; loadProgress(); loadUsers();
});
let t; $('q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.page = 1; loadUsers(); }, 300); });
$('fStatus').onchange = (e) => { state.status = e.target.value; state.page = 1; loadUsers(); };
$('prev').onclick = () => { state.page--; loadUsers(); };
$('next').onclick = () => { state.page++; loadUsers(); };

const refresh = () => Promise.all([loadStats(), loadUsers(), loadProgress()]).catch(() => {});
refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in · Matric500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#F3F4EE', surface:'#FFFFFF', surface2:'#E9EFE1', line:'#DDE2D8', ink:'#0F2A23', muted:'#3F544B', cyan:'#1F6B4F', magenta:'#C23B22', purple:'#0F2A23', volt:'#C8F25A', coral:'#FF6F4D' },
    fontFamily: { display:['"Bricolage Grotesque"','Figtree','sans-serif'], sans:['Figtree','system-ui','sans-serif'], mono:['"IBM Plex Mono"','monospace'] }
  } } };
</script>
<style>
  :focus-visible { outline: 3px solid #0F2A23; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
</style>
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">

<header class="border-b border-line">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
    <a href="/" class="flex items-center gap-2.5 font-display text-xl font-extrabold tracking-tight text-ink">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-ink" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F25A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v13a3 3 0 0 0 3 3h9"/><path d="M12 4v8"/></svg></span>Matric500
    </a>
    <a href="/" class="inline-flex min-h-[40px] items-center rounded-full border-2 border-ink px-4 py-1.5 text-sm font-bold text-ink hover:bg-ink hover:text-white">← Back to roadmap</a>
  </div>
</header>

<main class="mx-auto flex max-w-6xl justify-center px-4 py-12 sm:px-6 sm:py-20">
  <div class="w-full max-w-md rounded-[28px] border border-line bg-surface p-7 shadow-xl shadow-black/10 sm:p-9">

    <h1 class="font-display text-3xl font-extrabold leading-tight tracking-tight">Sign in to Matric500</h1>
    <p class="mt-2 text-base leading-relaxed text-muted">Keep your progress on every device. You can also use the roadmap as a guest.</p>

    <!-- shown when someone is already signed in -->
    <section id="signedIn" class="mt-6 hidden space-y-3">
      <p class="rounded-2xl bg-surface2 p-4 text-sm">Signed in as <b id="whoName"></b><span id="whoEmail" class="block text-muted"></span></p>
      <a href="/" class="flex min-h-[48px] items-center justify-center rounded-full bg-ink px-5 py-3 text-base font-bold text-white hover:bg-cyan">Continue to roadmap</a>
      <a id="adminDash" href="/admin" class="hidden min-h-[48px] items-center justify-center rounded-full border-2 border-ink bg-volt px-5 py-3 text-base font-bold text-ink">Open admin dashboard</a>
      <button id="signOutBtn" class="flex min-h-[48px] w-full items-center justify-center rounded-full border-2 border-ink px-5 py-3 text-base font-bold text-ink hover:bg-ink hover:text-white">Sign out</button>
    </section>

    <!-- shown when signed out -->
    <section id="signedOut" class="mt-6 space-y-5">
      <div>
        <div id="gsiBtn" class="flex min-h-[44px] justify-center"></div>
        <p id="gsiMsg" class="mt-3 min-h-[1rem] text-center text-sm text-muted" role="status">Loading sign-in…</p>
      </div>

      <div id="adminBox" class="hidden space-y-3 border-t border-line pt-5">
        <button id="adminToggle" type="button" class="w-full text-center text-sm font-bold text-cyan underline hover:text-ink" aria-expanded="false" aria-controls="adminForm">Admin sign in</button>
        <form id="adminForm" class="hidden space-y-3 text-left">
          <div><label for="adminEmail" class="text-xs font-bold text-muted">Admin email</label>
            <input id="adminEmail" type="email" autocomplete="username" required class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-3 text-base text-ink focus:border-ink focus:outline-none"></div>
          <div><label for="adminPass" class="text-xs font-bold text-muted">Password</label>
            <input id="adminPass" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-3 text-base text-ink focus:border-ink focus:outline-none"></div>
          <p id="adminErr" class="min-h-[1rem] text-sm text-magenta" role="alert"></p>
          <button class="flex min-h-[48px] w-full items-center justify-center rounded-full bg-ink px-5 py-3 text-base font-bold text-white hover:bg-cyan">Sign in as admin</button>
        </form>
      </div>

      <div class="border-t border-line pt-5 text-center">
        <a href="/" class="text-sm font-bold text-ink underline hover:text-cyan">Continue as a guest</a>
        <p class="mt-1 text-xs text-muted">Guest progress is saved on this device only.</p>
      </div>
    </section>

  </div>
</main>

<script src="login.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
